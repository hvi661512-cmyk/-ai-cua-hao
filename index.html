<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI CỦA HÀO</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 background:#080d18;

 color:white;

 font-family:Arial,sans-serif;

}

header{

 height:75px;

 display:flex;

 align-items:center;

 padding:12px;

 gap:12px;

 background:#101a2c;

 border-bottom:1px solid #263b5d;

}

.logo{

 background:#00d9ff;

 color:#07111c;

 padding:12px;

 border-radius:13px;

 font-weight:bold;

 font-size:22px;

}

h1{font-size:19px;margin:0}

header p{font-size:10px;color:#00d9ff;margin:5px 0}

button{

 border:0;

 cursor:pointer;

}

#newChat{

 margin-left:auto;

 background:#17304c;

 color:#00d9ff;

 padding:12px;

 border-radius:12px;

 font-size:22px;

}

#chat{

 height:calc(100dvh - 155px);

 overflow-y:auto;

 padding:15px;

}

.welcome{

 text-align:center;

 margin-top:65px;

}

.welcome .big{

 font-size:55px;

 color:#00d9ff;

}

.welcome h2{font-size:25px}

.welcome p{color:#91a5c2}

.message{

 padding:13px;

 margin:12px 0;

 max-width:88%;

 border-radius:15px;

 line-height:1.5;

 white-space:pre-wrap;

 overflow-wrap:anywhere;

}

.user{

 background:#075b79;

 margin-left:auto;

}

.ai{

 background:#17243a;

 border:1px solid #29415f;

}

.label{

 color:#00d9ff;

 font-size:11px;

 margin-bottom:5px;

}

footer{

 position:fixed;

 bottom:0;

 width:100%;

 padding:12px;

 background:#101a2c;

 border-top:1px solid #263b5d;

}

.inputbox{

 display:flex;

 gap:8px;

}

input{

 flex:1;

 min-width:0;

 background:#192840;

 border:1px solid #34506d;

 border-radius:13px;

 padding:14px;

 color:white;

 outline:none;

 font-size:15px;

}

#send{

 background:#00c9ee;

 color:#061522;

 font-weight:bold;

 padding:0 18px;

 border-radius:13px;

}

.note{

 text-align:center;

 font-size:10px;

 color:#7186a3;

 margin:9px 0 0;

}

</style>

</head>

<body>

<header>

 <div class="logo">AI</div>

 <div>

  <h1>AI CỦA HÀO</h1>

  <p>PERSONAL AI • VERSION 1.0</p>

 </div>

 <button id="newChat">＋</button>

</header>

<main id="chat">

 <div class="welcome" id="welcome">

  <div class="big">✦</div>

  <h2>Xin chào! Tôi là AI CỦA HÀO</h2>

  <p>Trợ lý AI cá nhân của bạn.</p>

  <p>Hôm nay tôi có thể giúp gì cho bạn?</p>

 </div>

</main>

<footer>

 <div class="inputbox">

  <input id="input" placeholder="Nhắn tin cho AI..." autocomplete="off">

  <button id="send">➤</button>

 </div>

 <div class="note">AI CỦA HÀO • VERSION 1.0</div>

</footer>

<script>

const chat=document.getElementById("chat");

const input=document.getElementById("input");

const welcome=document.getElementById("welcome");

let history=JSON.parse(localStorage.getItem("hao_history")||"[]");

function showMessage(text,type){

 const box=document.createElement("div");

 box.className="message "+type;

 if(type==="ai"){

  const label=document.createElement("div");

  label.className="label";

  label.textContent="✦ AI CỦA HÀO";

  box.appendChild(label);

 }

 const content=document.createElement("div");

 content.textContent=text;

 box.appendChild(content);

 chat.appendChild(box);

 chat.scrollTop=chat.scrollHeight;

}

function save(){

 localStorage.setItem("hao_history",JSON.stringify(history));

}

function render(){

 chat.innerHTML="";

 if(history.length===0){

  chat.appendChild(welcome);

  return;

 }

 history.forEach(m=>showMessage(m.text,m.type));

}

function reply(text){

 const q=text.toLowerCase();

 if(q.includes("xin chào")||q==="hello"||q==="hi"){

  return "Xin chào! Tôi là AI CỦA HÀO. Rất vui được trò chuyện với bạn!";

 }

 if(q.includes("bạn là ai")){

  return "Tôi là AI CỦA HÀO, trợ lý AI cá nhân phiên bản 1.0.";

 }

 if(q.includes("bóng đá")||q.includes("football")){

  return "Bóng đá là môn thể thao tuyệt vời! Bạn muốn tìm hiểu về cầu thủ, chiến thuật hay thủ môn?";

 }

 if(q.includes("việt nam")){

  return "Đội tuyển Việt Nam! 🇻🇳 Bạn muốn tìm hiểu về lịch sử, cầu thủ hay các giải đấu?";

 }

 if(q.includes("giúp")){

  return "Tôi sẵn sàng hỗ trợ! Hãy nói rõ điều bạn muốn tìm hiểu nhé.";

 }

 return "Tôi đã nhận được câu hỏi của bạn!\n\nHiện tại tôi đang chạy ở chế độ DEMO. Bộ não AI thực sự sẽ được kết nối ở phiên bản tiếp theo.";

}

function send(){

 const text=input.value.trim();

 if(!text)return;

 welcome.remove();

 input.value="";

 history.push({text,type:"user"});

 showMessage(text,"user");

 const answer=reply(text);

 history.push({text:answer,type:"ai"});

 showMessage(answer,"ai");

 save();

}

document.getElementById("send").onclick=send;

input.addEventListener("keydown",e=>{

 if(e.key==="Enter")send();

});

document.getElementById("newChat").onclick=()=>{

 history=[];

 save();

 chat.innerHTML="";

 chat.appendChild(welcome);

};

render();

</script>

</body>

</html>
